# Exemplo de produção: front estático + reverse proxy same-origin para a API e o socket.io.
# Same-origin elimina a necessidade de CORS no back (que hoje está com '*').
server {
  listen 443 ssl http2;
  server_name empregasaqua.com;
  # ssl_certificate / ssl_certificate_key ...

  root /var/www/empregasaqua-front/dist;
  index index.html;
  server_tokens off;
  client_max_body_size 6m;   # maior upload aceito pelo back é 5MB (PDF)

  # ---- Security headers ----
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://empregasaqua.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location /api/ {
    proxy_pass http://127.0.0.1:3009/;   # remove o prefixo /api
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /socket.io/ {
    proxy_pass http://127.0.0.1:3009;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }

  # Apenas logos são públicas. Documentos de verificação NÃO devem ser servidos estaticamente
  # (ver BACKEND_CONTRACT.md) — bloqueio defensivo aqui até o back corrigir.
  location /uploads/DocumentosEmpresas/ { return 404; }
  location /uploads/ {
    proxy_pass http://127.0.0.1:3009;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
